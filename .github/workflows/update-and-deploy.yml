name: Update OpenDART data

on:
  schedule:
    - cron: "0 0 1 * *" # 매월 1일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opendart-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and analyze OpenDART filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          test -n "$DART_API_KEY" || { echo "DART_API_KEY secret is not configured."; exit 1; }
          python scripts/fetch_opendart.py --start-year 2021
          python scripts/analyze.py
          python -m unittest discover -s tests -v
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if [ -d reports ]; then git add -A reports; fi
          git diff --cached --quiet || git commit -m "data: update OpenDART filings"
          git push
